<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charles Download</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 19h14"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.6 20 17M8.2 16.4 20 7"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 6.2v11.6L18 12Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7Z"/><path d="M13.5 3.5V8H18"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15.5V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5m0 3.2v.1"/><circle cx="12" cy="12" r="8.5"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4.5V9h-4.5"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7H10"/></symbol>
  </defs>
</svg>

<div id="full" hidden>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="">
      <div><strong data-t="Charles Download">Charles Download</strong><small data-t="Bir bağlantı. İstediğin kısım.">Bir bağlantı. İstediğin kısım.</small></div>
    </div>
    <div class="top-actions">
      <span id="engine" class="pill"><i></i><span></span></span>
      <button id="folder" class="round" data-t-title="İndirme klasörünü aç"><svg><use href="#i-folder"/></svg></button>
    </div>
  </header>
  <main>
    <form id="link-form" class="link-pill" autocomplete="off">
      <svg class="link-icon"><use href="#i-link"/></svg>
      <input id="url" type="url" required spellcheck="false" data-t-placeholder="Video veya dosya bağlantısını yapıştır" placeholder="Video veya dosya bağlantısını yapıştır">
      <button type="button" id="paste" class="ghost-icon" data-t-title="Panodan yapıştır"><svg><use href="#i-paste"/></svg></button>
      <button id="fetch" class="primary" data-t="Getir">Getir</button>
    </form>
    <label class="switch"><input id="watch" type="checkbox"><span class="knob"></span><span data-t="Kopyalanan bağlantıları yakala">Kopyalanan bağlantıları yakala</span></label>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="flow"></div>
    <section class="downloads">
      <div class="section-head">
        <h2><span data-t="İndirmeler">İndirmeler</span> <em id="count">0</em></h2>
        <div class="tabs" role="tablist">
          <button data-filter="all" class="active" data-t="Tümü">Tümü</button>
          <button data-filter="active" data-t="Devam eden">Devam eden</button>
          <button data-filter="done" data-t="Tamamlanan">Tamamlanan</button>
        </div>
      </div>
      <div id="jobs"></div>
      <div id="empty">
        <div class="empty-tile"><svg><use href="#i-down"/></svg></div>
        <strong data-t="Henüz indirme yok">Henüz indirme yok</strong>
        <p data-t="Bir bağlantı kopyala; Charles adacığın altında sorar.">Bir bağlantı kopyala; Charles adacığın altında sorar.</p>
      </div>
    </section>
  </main>
  <footer>
    <svg><use href="#i-folder"/></svg>
    <span data-t="Kayıt klasörü">Kayıt klasörü</span>
    <span id="destination"></span>
    <button id="choose-folder" class="link-btn" data-t="Değiştir">Değiştir</button>
    <span class="ver">DOWNLOAD 1.0</span>
  </footer>
</div>

<div id="compact" hidden><div id="card"></div></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
